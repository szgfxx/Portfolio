<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sagun Bhandari · Portfolio</title>
  <meta name="description" content="Sagun Bhandari's portfolio — climb from Phewa lake to the summit of Annapurna I." />
  <meta name="theme-color" content="#13301f" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700&family=Yatra+One&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/trail.css" />
</head>
<body class="trail">
  <canvas id="trail-scene" class="scene-canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="topbar__back" href="index.html">← back to the fork</a>
    <nav class="topbar__nav" aria-label="Sections"></nav>
    <a class="topbar__alt" href="that-way.html" title="the fun side">that way ↝</a>
  </header>

  <!-- Sagun hiking ahead of you, chatting as you climb; positioned by js/trail.js -->
  <div class="hiker" aria-hidden="true">
    <span class="hiker__bubble"></span>
    <span class="hiker__fig" data-sagun="walker" data-idle="back" data-walk="backwalk"></span>
  </div>

  <!-- the card for whatever she's talking about right now -->
  <div class="climb-card" aria-live="polite"></div>

  <aside class="altimeter" aria-hidden="true">
    <div class="altimeter__track"><div class="altimeter__fill"></div><div class="altimeter__dot"></div></div>
    <div class="altimeter__read"><span id="alt-m">822</span> m</div>
    <div class="altimeter__label" id="alt-label">Phewa lakeside</div>
  </aside>

  <main id="trail-content">
    <section class="stage stage--intro" id="top">
      <div class="intro">
        <h1 class="intro__name">Summit with Sagun</h1>
        <p class="intro__go">Let’s chat.</p>
        <p class="intro__scroll">scroll to start<span>↓</span></p>
      </div>
    </section>

    <!-- the climb itself: a long stretch of scroll. js/trail.js drops a chapter
         anchor in here for each part of the story, so the nav links still work -->
    <section class="climb" id="climb" aria-label="Sagun’s story, told on the way up"></section>

    <section class="stage stage--summit" id="summit" data-alt="Annapurna I summit" data-nav="Contact">
      <div class="summit">
        <p class="intro__kicker">annapurna I summit · 8,091 m</p>
        <h2 class="summit__title">We made it to the top!</h2>
        <p class="summit__sub">Thank you for walking with me.</p>
        <div class="summit__contact">
          <h3>Want to learn more? Find me here.</h3>
          <div class="intro__links" data-fill="links"></div>
        </div>
        <p class="summit__foot">
          <a href="index.html">back to the fork</a> ·
          <a href="that-way.html">see the fun side</a> ·
          <a href="#top">walk back down ↑</a>
        </p>
      </div>
    </section>
  </main>

  <script src="js/content.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/sagun.js"></script>
  <script src="js/render.js"></script>
  <script src="js/trail.js"></script>
</body>
</html>
